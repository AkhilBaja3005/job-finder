<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Job Finder AutoFill</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .header h2 {
      font-size: 15px;
      margin: 0;
      color: #38bdf8;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s ease;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .info {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 18px;">⚡</span>
    <h2>Job Finder AutoFill</h2>
  </div>
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <span class="info">Backend Server:</span>
    <span id="backend-status" class="status-badge">Checking...</span>
  </div>
  <div style="margin-top: 12px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 10px;">
    <div style="font-size: 11px; font-weight: 700; color: #38bdf8; text-transform: uppercase; margin-bottom: 6px;">🔑 6-Digit Extension Sync Key</div>
    <input type="text" id="user-token" placeholder="e.g. A7X9K2" maxlength="6" style="width: 100%; box-sizing: border-box; background: #1e293b; border: 1px solid #38bdf8; color: #38bdf8; padding: 8px; border-radius: 6px; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; text-align: center; margin-top: 2px;">
    
    <div id="user-info-card" style="margin-top: 8px; padding: 8px 10px; background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 6px; display: none;">
      <div style="font-size: 11px; font-weight: 700; color: #38bdf8;" id="user-name-display">Connected User</div>
      <div style="font-size: 10px; color: #94a3b8; margin-top: 2px;" id="user-email-display">user@example.com</div>
    </div>
    
    <div style="font-size: 11px; font-weight: 700; color: #38bdf8; text-transform: uppercase; margin-top: 12px; margin-bottom: 6px;">⚖️ Equal Employment (EEO) Profile</div>
    
    <label style="font-size: 11px; color: #94a3b8; display: block;">US Work Authorization:</label>
    <select id="eeo-work-auth" style="width: 100%; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 5px; border-radius: 6px; font-size: 11px; margin-top: 2px;">
      <option value="No">No</option>
      <option value="Yes">Yes</option>
    </select>

    <label style="font-size: 11px; color: #94a3b8; display: block; margin-top: 6px;">Visa Sponsorship Required:</label>
    <select id="eeo-sponsorship" style="width: 100%; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 5px; border-radius: 6px; font-size: 11px; margin-top: 2px;">
      <option value="No">No</option>
      <option value="Yes">Yes</option>
    </select>

    <label style="font-size: 11px; color: #94a3b8; display: block; margin-top: 6px;">Gender:</label>
    <select id="eeo-gender" style="width: 100%; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 5px; border-radius: 6px; font-size: 11px; margin-top: 2px;">
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Decline to Self-Identify">Decline to Self-Identify</option>
    </select>

    <label style="font-size: 11px; color: #94a3b8; display: block; margin-top: 6px;">Disability Status:</label>
    <select id="eeo-disability" style="width: 100%; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 5px; border-radius: 6px; font-size: 11px; margin-top: 2px;">
      <option value="No">No, I Don't Have A Disability</option>
      <option value="Yes">Yes, I Have A Disability</option>
      <option value="Decline to Answer">Decline to Answer</option>
    </select>

    <button id="btn-save-profile" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid rgba(56, 189, 248, 0.4); background: rgba(56, 189, 248, 0.1); color: #38bdf8; font-weight: 700; font-size: 11px; cursor: pointer; margin-top: 10px;">💾 Save User Profile</button>
  </div>

  <button id="btn-autofill" class="btn">⚡ Fill Active Application</button>
  <div class="info">
    Supports Greenhouse, Lever, Workday, Indeed, and LinkedIn job portals with AI-powered resume matching.
  </div>
  <script src="popup.js"></script>
</body>
</html>
