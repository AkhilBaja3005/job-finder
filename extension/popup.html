<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Job Finder AutoFill</title>
  <style>
    body {
      width: 330px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .header h2 {
      font-size: 14px;
      margin: 0;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .section-title {
      font-size: 10px;
      font-weight: 700;
      color: #38bdf8;
      text-transform: uppercase;
      margin-top: 10px;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    .btn {
      width: 100%;
      padding: 9px;
      border-radius: 6px;
      border: none;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s ease;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-auto {
      background: linear-gradient(135deg, #10b981, #059669);
    }
    .btn-stop {
      background: linear-gradient(135deg, #ef4444, #dc2626);
    }
    .stats-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .stat-box {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 6px;
      text-align: center;
    }
    .stat-val {
      font-size: 14px;
      font-weight: 800;
      color: #38bdf8;
    }
    .stat-lbl {
      font-size: 9px;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .log-container {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 6px 8px;
      font-family: monospace;
      font-size: 10px;
      color: #94a3b8;
      max-height: 80px;
      overflow-y: auto;
      margin-top: 8px;
    }
    .info {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.3;
      margin-top: 8px;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 11px;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2><span>⚡</span> Job Finder AutoFill</h2>
    <span id="backend-status" class="status-badge">Checking...</span>
  </div>

  <!-- Auto-Apply Batch Controls -->
  <div style="background: rgba(56, 189, 248, 0.05); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 8px; padding: 10px; margin-bottom: 10px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 11px; font-weight: 700; color: #fff;">🤖 LinkedIn Batch Auto-Apply</span>
      <span id="auto-status-text" style="font-size: 10px; color: #94a3b8; font-weight: 600;">Idle</span>
    </div>
    <button id="btn-toggle-auto" class="btn btn-auto">▶️ Start Batch Auto-Apply</button>

    <div class="stats-row">
      <div class="stat-box">
        <div id="stat-applied" class="stat-val">0</div>
        <div class="stat-lbl">Applied</div>
      </div>
      <div class="stat-box">
        <div id="stat-skipped" class="stat-val">0</div>
        <div class="stat-lbl">Skipped</div>
      </div>
    </div>
  </div>

  <!-- Logs window -->
  <div class="section-title">📋 Automation Log</div>
  <div id="log-window" class="log-container">
    <div>Ready to start auto-fill...</div>
  </div>

  <div style="margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 8px;">
    <div class="section-title">🔑 6-Digit Sync Key</div>
    <input type="text" id="user-token" placeholder="e.g. A7X9K2" maxlength="6" style="border-color: #38bdf8; color: #38bdf8; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; text-align: center;">

    <div id="user-info-card" style="margin-top: 6px; padding: 6px 8px; background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 6px; display: none;">
      <div style="font-size: 11px; font-weight: 700; color: #38bdf8;" id="user-name-display">Connected User</div>
      <div style="font-size: 10px; color: #94a3b8;" id="user-email-display">user@example.com</div>
    </div>

    <div class="section-title">🎯 Filtering Rules</div>
    <label style="font-size: 10px; color: #94a3b8;">Max Experience Required (Years):</label>
    <input type="number" id="cfg-max-years" value="5" min="0" max="30">

    <label style="font-size: 10px; color: #94a3b8; display: block; margin-top: 4px;">Blacklist Keywords (comma separated):</label>
    <input type="text" id="cfg-blacklist" placeholder="e.g. Senior, Lead, Manager">

    <div class="section-title">⚖️ EEO Preferences</div>
    <label style="font-size: 10px; color: #94a3b8;">US Work Auth:</label>
    <select id="eeo-work-auth">
      <option value="No">No</option>
      <option value="Yes">Yes</option>
    </select>

    <label style="font-size: 10px; color: #94a3b8; display: block; margin-top: 4px;">Visa Sponsorship Required:</label>
    <select id="eeo-sponsorship">
      <option value="No">No</option>
      <option value="Yes">Yes</option>
    </select>

    <button id="btn-save-profile" style="width: 100%; padding: 7px; border-radius: 6px; border: 1px solid rgba(56, 189, 248, 0.4); background: rgba(56, 189, 248, 0.1); color: #38bdf8; font-weight: 700; font-size: 11px; cursor: pointer; margin-top: 8px;">💾 Save Preferences</button>
  </div>

  <button id="btn-autofill" class="btn">⚡ Fill Active Application</button>
  <div class="info">
    Supports Greenhouse, Lever, Workday, Indeed, and LinkedIn with AI accuracy.
  </div>
  <script src="popup.js"></script>
</body>
</html>
