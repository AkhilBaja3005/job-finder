name: Release

# Makes a numbered release. It starts in two ways:
#   - Automatically: after a `release: X.Y.Z` pull request is merged ("Prepare release" merges it for you), this runs as soon as
#     every check on that merge commit has passed (tests, Mac arm64 and Windows builds).
#   - By hand: Actions -> "Release" -> Run workflow, type the version (for example 1.9.4). Use it to retry or to release a
#     version bump that was merged some other way.
#
# It checks the version and the tag, creates the GitHub release and tag, builds the Mac and Windows apps and attaches them
# to it (the in-app "Check for updates" starts reporting the new version), and publishes the command line tool to PyPI when
# asked: tick the box on a manual run, or set the repository variable AUTO_PUBLISH_PYPI to "true" for automatic runs.
on:
  workflow_run:
    workflows: ["CI Verification & Tests", "Build desktop apps"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, exactly as in pyproject.toml (for example 1.9.4)"
        required: true
        type: string
      publish_pypi:
        description: "Also publish the command line tool to PyPI"
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # create the release and tag
  actions: write    # start the build and PyPI workflows

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Automatic runs only for a successful push CI on a commit whose subject is "release: X.Y.Z".
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_commit.message, 'release: '))
    env:
      # Your RELEASE_TOKEN creates the release: the workflow's own token was refused (403) when creating it. Falls back to the
      # built-in token if the secret is missing.
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0

      - name: Work out the version
        id: v
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            PYPI="${{ inputs.publish_pypi }}"
          else
            VERSION=$(printf '%s\n' "$COMMIT_MESSAGE" | head -1 | sed -nE 's/^release: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')
            PYPI="${{ vars.AUTO_PUBLISH_PYPI == 'true' }}"
            if [ -z "$VERSION" ]; then echo "::notice::Not a release commit; nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Version must look like 1.9.4"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pypi=$PYPI" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check the version, the tag and CI
        if: steps.v.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/check_release_version.py "v$VERSION"
          if gh release view "v$VERSION" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "::error::v$VERSION already exists. Bump the version first."; exit 1; fi
            echo "::notice::v$VERSION already exists; nothing to do."; echo "NOTHING_TO_DO=true" >> "$GITHUB_ENV"; exit 0
          fi
          SHA=$(git rev-parse HEAD)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # A manual run releases the commit that set this version, not whatever is newest on main: later commits (for
            # example a workflow-only change) never ran the Mac and Windows builds.
            FOUND=$(git log -1 --format=%H -S"version = \"$VERSION\"" -- pyproject.toml)
            if [ -n "$FOUND" ]; then SHA="$FOUND"; fi
          fi
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          # Every required check on this commit must have passed: the tests and the Mac arm64 and Windows builds.
          # (Mac Intel may fail without blocking a release.) Two workflows trigger this one; whichever finishes
          # last finds everything green, the earlier one stops here and waits.
          STATE=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100" --jq '
            [.check_runs[] | select(.name=="Distribution & Test Suite" or .name=="Mac arm64" or .name=="Windows")] as $c
            | if ([$c[].name] | unique | length) < 3 then "waiting"
              elif any($c[]; .status != "completed") then "waiting"
              elif all($c[]; .conclusion == "success") then "success"
              else "failed" end')
          echo "Checks on ${SHA:0:7}: $STATE"
          if [ "$STATE" = "success" ]; then exit 0; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Checks on main (${SHA:0:7}) are '$STATE'. Wait for them to pass, then run again."; exit 1
          fi
          echo "::notice::Checks on ${SHA:0:7} are '$STATE'; not releasing now."
          echo "NOTHING_TO_DO=true" >> "$GITHUB_ENV"

      - name: Create the GitHub release
        if: steps.v.outputs.skip != 'true' && env.NOTHING_TO_DO != 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release create "v$VERSION" --target "$SHA" --title "Job Finder $VERSION" --generate-notes; then exit 0; fi
          echo "::warning::gh release create was refused. Printing GitHub's full answer, then trying a draft."
          echo "::group::Full answer (headers show the permission GitHub wanted)"
          gh api -i -X POST "repos/${GITHUB_REPOSITORY}/releases" -f tag_name="v$VERSION" -f target_commitish="$SHA" \
            -f name="Job Finder $VERSION" -F draft=true -F generate_release_notes=true 2>&1 | head -40 || true
          echo "::endgroup::"
          ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq "[.[] | select(.tag_name==\"v$VERSION\" and .draft)] | first | .id // empty" 2>/dev/null || true)
          if [ -n "$ID" ]; then
            echo "Draft $ID exists; publishing it."
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/$ID" -F draft=false
            exit 0
          fi
          exit 1

      - name: Build the desktop apps and attach them to the release
        if: steps.v.outputs.skip != 'true' && env.NOTHING_TO_DO != 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: gh workflow run build_desktop_apps.yml --ref "v$VERSION" -f release_tag="v$VERSION"

      - name: Publish to PyPI
        if: steps.v.outputs.skip != 'true' && env.NOTHING_TO_DO != 'true' && steps.v.outputs.pypi == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: gh workflow run publish_pypi.yml --ref "v$VERSION" -f target=pypi

      - name: Summary
        if: steps.v.outputs.skip != 'true' && env.NOTHING_TO_DO != 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
          PYPI: ${{ steps.v.outputs.pypi }}
        run: |
          {
            echo "### Released v$VERSION"
            echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v$VERSION"
            echo "- Desktop builds: https://github.com/${GITHUB_REPOSITORY}/actions/workflows/build_desktop_apps.yml"
            if [ "$PYPI" = "true" ]; then echo "- PyPI: https://github.com/${GITHUB_REPOSITORY}/actions/workflows/publish_pypi.yml"; fi
          } >> "$GITHUB_STEP_SUMMARY"
