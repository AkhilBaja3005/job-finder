name: Sync GitHub Repository to Hugging Face Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-to-hugingface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Secret HF_TOKEN is not set in GitHub repository settings!"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Inject Hugging Face Space frontmatter dynamically into README.md
          printf -- "---\ntitle: AI Job Finder Agent\nsdk: docker\napp_port: 8000\npinned: false\n---\n\n" | cat - README.md > /tmp/README.md
          mv /tmp/README.md README.md
          git commit -am "chore(hf): inject Hugging Face Space metadata for container build [skip ci]" || true

          git remote add hf https://AkhilBaja3005:${HF_TOKEN}@huggingface.co/spaces/abaja/job-finder
          # HF rejects new binary files in pushed history, and history keeps them forever.
          # Push a one-commit snapshot of the tree without the store listing assets.
          git checkout --orphan hf-snapshot
          git rm -r -q --cached docs/chrome-store || true
          git commit -q -m "Sync from GitHub ${GITHUB_SHA} [skip ci]"
          git push hf hf-snapshot:main --force

      - name: Trigger Hugging Face Factory Rebuild
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "Triggering Hugging Face factory rebuild to invalidate Docker caches..."
          status_code=$(curl -s -o /tmp/hf_restart_response.json -w "%{http_code}" -X POST "https://huggingface.co/api/spaces/abaja/job-finder/restart?factory=true" \
            -H "Authorization: Bearer ${HF_TOKEN}")
          echo "Hugging Face restart API responded with HTTP: $status_code"
          cat /tmp/hf_restart_response.json
          if [ "$status_code" -ne 200 ]; then
            echo "::warning::Hugging Face restart API returned HTTP $status_code"
          fi
