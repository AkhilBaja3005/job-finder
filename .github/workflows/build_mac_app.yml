name: Build Mac app

# Builds "Job Finder.app" and a .dmg on a macOS runner (Apple Silicon).
#   - Manual run: Actions -> "Build Mac app" -> Run workflow. The .dmg is an artifact of the run.
#   - On a published GitHub release the .dmg is also attached to that release.
# The app is not signed or notarized yet, so macOS asks users to right-click -> Open the first time.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write   # attach the .dmg to a release

jobs:
  build:
    name: Build .app and .dmg
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Build
        run: macapp/build_mac.sh

      - name: Smoke test the built app
        run: |
          export JOB_FINDER_APP_HOME="$RUNNER_TEMP/jf-home"
          export JOB_FINDER_SKIP_BROWSER_INSTALL=1
          "dist-mac/Job Finder.app/Contents/MacOS/Job Finder" --check --port 8123

      - uses: actions/upload-artifact@v4
        with:
          name: job-finder-mac
          path: dist-mac/*.dmg
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist-mac/*.dmg --clobber
