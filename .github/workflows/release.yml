name: Release

# One workflow for a numbered release. It builds the Mac and Windows apps, publishes the command line tool to PyPI and makes
# the GitHub release, in this order:
#   1. checks      the version matches pyproject.toml, the tag is new, and the tests, Mac arm64 and Windows builds passed on
#                  the commit that set the version
#   2. release     creates the GitHub release as a PRE-RELEASE (the in-app update check ignores those)
#   3. apps        builds Mac (arm64, Intel) and Windows and attaches the versioned files to that release
#   4. pypi        runs "Build & Publish to PyPI" (kept as its own workflow: PyPI trusts that file name) and waits for it
#   5. publish     only when 3 and 4 succeeded: turns the pre-release into the latest release, so installed apps see the update
# If anything fails the release stays a pre-release; fix it and run again, or delete the pre-release and its tag.
#
# Starts when "Prepare release" merges & dispatches it, or by hand:
# Actions -> Release -> Run workflow. PyPI is included on a manual run when the box is ticked, and on an automatic run when
# the repository variable AUTO_PUBLISH_PYPI is "true".
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, exactly as in pyproject.toml (for example 1.9.5)"
        required: true
        type: string
      publish_pypi:
        description: "Also publish the command line tool to PyPI"
        required: false
        default: true
        type: boolean

permissions:
  contents: write   # create the release and tag, attach files
  actions: write    # start the PyPI workflow
  id-token: write   # the called app build and PyPI workflows may ask for it

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    name: Check the release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      go: ${{ steps.check.outputs.go }}
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
      pypi: ${{ steps.v.outputs.pypi }}
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Work out the version
        id: v
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          PYPI="${{ inputs.publish_pypi }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Version must look like 1.9.5"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pypi=$PYPI" >> "$GITHUB_OUTPUT"

      - name: Check the version, the tag and the builds
        id: check
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/check_release_version.py "v$VERSION"
          echo "go=false" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "::error::v$VERSION already exists. Delete it first, or bump the version."; exit 1; fi
            echo "::notice::v$VERSION already exists; nothing to do."; exit 0
          fi
          SHA=$(git rev-parse HEAD)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # A manual run releases the commit that set this version, not whatever is newest on main: later commits (for
            # example a workflow-only change) never ran the Mac and Windows builds.
            FOUND=$(git log -1 --format=%H -S"version = \"$VERSION\"" -- pyproject.toml)
            if [ -n "$FOUND" ]; then SHA="$FOUND"; fi
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # The tests and the Mac arm64 and Windows builds must all have passed on that commit (Mac Intel may fail). Cancelled runs
          # say nothing about the code and are ignored; the newest other result per check counts. Poll while main CI finishes.
          STATE="waiting"
          for i in $(seq 1 40); do
            STATE=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100" --jq '
              [.check_runs[] | select(.name=="Distribution & Test Suite" or .name=="Mac arm64" or .name=="Windows")
                             | select(.conclusion != "cancelled")]
              | group_by(.name) | map(max_by(.id)) as $c
              | if ([$c[].name] | unique | length) < 3 then "waiting"
                elif any($c[]; .status != "completed") then "waiting"
                elif all($c[]; .conclusion == "success") then "success"
                else "failed" end')
            echo "Checks on ${SHA:0:7} (attempt $i): $STATE"
            if [ "$STATE" = "success" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            if [ "$STATE" = "failed" ]; then echo "::error::Checks on ${SHA:0:7} failed."; exit 1; fi
            sleep 30
          done
          echo "::error::Timed out waiting for checks on ${SHA:0:7} ($STATE)."; exit 1

  release:
    name: Create the pre-release
    needs: checks
    if: needs.checks.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      VERSION: ${{ needs.checks.outputs.version }}
      SHA: ${{ needs.checks.outputs.sha }}
    steps:
      - name: Create the pre-release
        run: |
          if gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "Job Finder $VERSION" --generate-notes --prerelease; then exit 0; fi
          echo "::warning::gh release create was refused. GitHub's full answer follows (the x-accepted-github-permissions header names the permission it wanted)."
          gh api -i -X POST "repos/${GITHUB_REPOSITORY}/releases" -f tag_name="v$VERSION" -f target_commitish="$SHA" \
            -f name="Job Finder $VERSION" -F prerelease=true -F generate_release_notes=true 2>&1 | head -40 || true
          exit 1

  apps:
    name: Mac and Windows apps
    needs: [checks, release]
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/build_desktop_apps.yml
    with:
      release_tag: v${{ needs.checks.outputs.version }}
      ref: ${{ needs.checks.outputs.sha }}
    secrets: inherit

  pypi:
    name: Publish to PyPI
    needs: [checks, release]
    if: needs.checks.outputs.pypi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - name: Start "Build & Publish to PyPI" for the release tag and wait for it
        run: |
          set -euo pipefail
          START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run publish_pypi.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="v$VERSION" -f target=pypi -f create_release=false
          RID=""
          for i in $(seq 1 30); do
            RID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish_pypi.yml --event workflow_dispatch --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"$START\")] | last | .databaseId // empty")
            [ -n "$RID" ] && break
            sleep 5
          done
          if [ -z "$RID" ]; then echo "::error::The PyPI run did not start."; exit 1; fi
          echo "PyPI run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/$RID"
          gh run watch "$RID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30

  publish:
    name: Publish the release
    needs: [checks, apps, pypi]
    # Runs only when the apps built and PyPI either succeeded or was not asked for.
    if: always() && needs.checks.outputs.go == 'true' && needs.apps.result == 'success' && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - name: Make it the latest release
        run: |
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          {
            echo "### Released v$VERSION"
            echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v$VERSION"
            echo "- PyPI: $([ "${{ needs.pypi.result }}" = "success" ] && echo published || echo 'not requested')"
          } >> "$GITHUB_STEP_SUMMARY"
