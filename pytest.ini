[pytest]
testpaths = backend/tests backend/mcp
python_files = test_*.py *_test.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
norecursedirs = backend/scratch scratch .git node_modules dist backend/venv venv
filterwarnings =
    ignore:.*_UnionGenericAlias.*:DeprecationWarning
    ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:DeprecationWarning
    ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:UserWarning
markers =
    slow: marks tests as slow or resource-intensive

