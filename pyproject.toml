[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-finder-ai"
version = "0.1.1"
description = "Autonomous career agent, ATS resume tailor, and job search copilot."
readme = "README_PYPI.md"
license = { text = "MIT" }
authors = [
    { name = "Akhil Baja", email = "akhilbaja.work@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["job-search", "ats-resume-tailor", "browser-use", "career-agent", "mcp-server", "playwright"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies for standard local runs (zero cloud required)
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "pypdf>=3.15.0",
    "python-docx>=0.8.11",
    "playwright>=1.40.0",
    "google-genai>=0.1.0",
    "google-api-core>=2.11.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",
    "browser-use>=0.1.0",
]

[project.optional-dependencies]
# Cloud Database / Auth integrations
supabase = [
    "httpx>=0.24.0",
]

# Cloud storage & mirror
huggingface = [
    "huggingface-hub>=0.20.0",
]

# Alternative model providers
anthropic = [
    "anthropic>=0.18.0",
]
groq = [
    "groq>=0.4.0",
]

# All cloud integrations bundle
cloud = [
    "httpx>=0.24.0",
    "huggingface-hub>=0.20.0",
]

# Development and testing
dev = [
    "pytest>=7.4.0",
    "pyright>=1.1.300",
    "sentry-sdk>=1.30.0",
]

# Complete installation
all = [
    "httpx>=0.24.0",
    "huggingface-hub>=0.20.0",
    "anthropic>=0.18.0",
    "groq>=0.4.0",
    "sentry-sdk>=1.30.0",
    "pytest>=7.4.0",
    "pyright>=1.1.300",
]

[project.scripts]
job-finder = "job_finder.cli:main"
job-finder-scanner = "job_finder.cli:scanner_cli"
job-finder-mcp = "backend.mcp.server:main"
job-finder-server = "backend.main:start_server"

[project.urls]
Homepage = "https://github.com/AkhilBaja3005/job-finder"
Repository = "https://github.com/AkhilBaja3005/job-finder.git"

[tool.setuptools]
packages = [
    "job_finder",
    "backend",
    "backend.config",
    "backend.mcp",
    "backend.mcp.tools",
    "backend.routes",
    "backend.services",
    "backend.utils",
    "applications_tracker",
]

[tool.setuptools.package-data]
"*" = ["*.json", "*.cls", "*.tex", "*.md", "*.yaml", "*.yml"]
