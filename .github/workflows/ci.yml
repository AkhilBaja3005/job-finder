name: CI Verification & Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    name: Distribution & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Build frontend assets
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm ci || npm install
            npm run build
            cd ..
            mkdir -p backend/static_frontend/assets
            cp -r frontend/dist/* backend/static_frontend/
          else
            mkdir -p backend/static_frontend/assets
          fi

      - name: Install dependencies & build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine pytest pytest-asyncio
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi
          pip install -e . --no-deps

      - name: Install Tectonic XeLaTeX Engine
        run: |
          curl -Lo tectonic.tar.gz https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf tectonic.tar.gz
          sudo mv tectonic /usr/local/bin/
          rm tectonic.tar.gz
          tectonic --version

      - name: Run verification script
        run: python3 scripts/verify_distribution.py
