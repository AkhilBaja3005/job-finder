name: Build & Publish to PyPI

# ─────────────────────────────────────────────────────────────────────────────
# Manual-only trigger.  Go to GitHub → Actions → "Build & Publish to PyPI"
# → "Run workflow" and choose your target (testpypi or pypi).
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi   # smoke-test first (safe default)
          - pypi       # production release
      version_tag:
        description: "Optional version override (e.g. 0.2.0). Leave blank to use pyproject.toml."
        required: false
        default: ""

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 – Build sdist + wheel and verify them
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build distribution packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build + twine
        run: python -m pip install --upgrade pip build twine

      # Optionally bump the version in pyproject.toml before building
      - name: Override version (if provided)
        if: ${{ github.event.inputs.version_tag != '' }}
        run: |
          sed -i "s/^version = .*/version = \"${{ github.event.inputs.version_tag }}\"/" pyproject.toml
          echo "Building version: ${{ github.event.inputs.version_tag }}"

      # Build frontend distribution if frontend source is present
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Build frontend assets
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm ci || npm install
            npm run build
            cd ..
            mkdir -p backend/static_frontend
            cp -r frontend/dist/* backend/static_frontend/
            echo "Successfully built and staged frontend/dist assets into backend/static_frontend/"
          fi

      - name: Build sdist and wheel
        run: python -m build


      - name: Verify distributions with twine check
        run: python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 – Publish to TestPyPI  (runs when target == testpypi)
  # Uses PyPI Trusted Publishing (OIDC) — no API token needed.
  # ───────────────────────────────────────────────────────────────────────────
  publish-testpypi:
    name: Publish → TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.target == 'testpypi'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/job-finder-ai
    permissions:
      id-token: write   # OIDC Trusted Publishing

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 – Publish to production PyPI  (runs when target == pypi)
  # ───────────────────────────────────────────────────────────────────────────
  publish-pypi:
    name: Publish → PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.target == 'pypi'
    environment:
      name: pypi
      url: https://pypi.org/p/job-finder-ai
    permissions:
      id-token: write   # OIDC Trusted Publishing

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4 – Create a GitHub Release after a successful PyPI publish
  # ───────────────────────────────────────────────────────────────────────────
  create-github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    if: github.event.inputs.target == 'pypi'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/

      - name: Derive release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            echo "tag=v${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(python -c "import re, sys; m=re.search(r'version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read()); sys.exit(0) or print(m.group(1)) if m else sys.exit(1)")
            echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: dist/*
