<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Job Finder ATS Tailor</title>
  <style>
    body {
      width: 380px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .header h2 {
      font-size: 15px;
      margin: 0;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
    }
    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .score-box {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .score-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.15);
      border: 3px solid #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      color: #38bdf8;
      flex-shrink: 0;
    }
    .skill-chip {
      display: inline-block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      margin: 2px 4px 2px 0;
    }
    .btn {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #0a66c2, #0284c7);
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: #38bdf8;
      border: 1px solid rgba(56,189,248,0.3);
    }
    .btn-email {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
    }
    .preview-box {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
      margin-bottom: 12px;
      max-height: 180px;
      overflow-y: auto;
      font-size: 11px;
      line-height: 1.5;
      color: #e2e8f0;
      white-space: pre-wrap;
      word-break: break-word;
      text-align: left;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #1e293b;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      margin-top: 4px;
      font-weight: 600;
      text-align: center;
    }
    .toast {
      position: relative;
      margin-top: 10px;
      background: rgba(2, 132, 199, 0.2);
      border: 1px solid #0284c7;
      color: #38bdf8;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2><span>🎯</span> Job Finder ATS Tailor</h2>
    <span id="backend-status" class="status-badge">Connected</span>
  </div>

  <!-- Detected Active Job Card -->
  <div id="job-active-card" class="card">
    <div style="font-size: 10px; font-weight: 700; color: #38bdf8; text-transform: uppercase; margin-bottom: 4px;">Detected Active Job:</div>
    <div id="active-role-title" style="font-size: 13px; font-weight: 700; color: #fff;">Detecting job page...</div>
    <div id="active-company-name" style="font-size: 11px; color: #94a3b8; margin-top: 2px;">Open LinkedIn, Indeed, or Workday</div>
  </div>

  <!-- ATS Match Score Section -->
  <div id="score-section" class="score-box" style="display: none;">
    <div id="ats-score-circle" class="score-circle">--%</div>
    <div>
      <div style="font-weight: 700; font-size: 13px;">ATS Match Score</div>
      <div id="ats-score-sub" style="font-size: 11px; color: #94a3b8; margin-top: 2px;">Missing key keywords</div>
    </div>
  </div>

  <!-- Missing Skills Chips -->
  <div id="missing-skills-section" style="margin-bottom: 12px; display: none;">
    <div style="font-size: 10px; font-weight: 700; color: #fca5a5; text-transform: uppercase; margin-bottom: 4px;">Top Missing Keywords:</div>
    <div id="missing-skills-container"></div>
  </div>

  <!-- Interactive Text Preview Box for Cover Letter / Outreach -->
  <div id="text-preview-wrapper" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span id="preview-title" style="font-size: 11px; font-weight: 700; color: #38bdf8; text-transform: uppercase;">Preview Generated Content</span>
      <button id="btn-copy-preview" style="background: #0284c7; border: none; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; cursor: pointer;">📋 Copy to Clipboard</button>
    </div>
    <div id="text-preview-content" class="preview-box"></div>
  </div>

  <!-- Extension Action Buttons -->
    <button id="btn-email-tailor" class="btn btn-email">📧 1-Click Email Tailored Package</button>
  <button id="btn-cover-letter" class="btn btn-secondary">📝 Generate & Preview Cover Letter</button>
  <button id="btn-outreach" class="btn btn-secondary">✉️ Generate & Preview Recruiter Outreach</button>

  <div style="margin-top: 14px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 10px;">
    <div style="font-size: 10px; font-weight: 700; color: #38bdf8; text-transform: uppercase;">🔑 Extension Sync Key:</div>
    <input type="text" id="user-token" placeholder="Paste Sync Key from Dashboard">
    <div id="user-info-card" style="margin-top: 8px; padding: 8px 10px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 8px; display: none;">
      <div style="font-size: 11px; font-weight: 700; color: #34d399;" id="user-name-display">👤 Connected User</div>
      <div style="font-size: 10px; color: #94a3b8; margin-top: 2px;" id="user-email-display">user@example.com</div>
    </div>
  </div>

  <div id="popup-toast" class="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
