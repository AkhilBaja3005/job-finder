name: Deploy to GCP Always Free VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy Docker Container to GCP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to GCP VM via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            cd ~/job-finder
            git fetch origin main
            git reset --hard origin/main
            docker build -t jobfinder .
            docker stop jobfinder-app || true
            docker rm jobfinder-app || true
            docker run -d \
              --name jobfinder-app \
              --restart always \
              -p 80:8000 \
              -p 8000:8000 \
              --env-file backend/.env \
              jobfinder
            echo "🚀 Automated Deployment Complete!"
